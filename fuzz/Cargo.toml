[package]
name = "lunamodel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
itertools = "0.15.0"
lunamodel-core = { path = "../crates/core" }
lunamodel-error = { path = "../crates/error" }
lunamodel-serializer = { path = "../crates/serializer" }
lunamodel-translate = { path = "../crates/translate" }
lunamodel-types = { path = "../crates/types" }

# Not a member of the main workspace, which stays on stable.
[workspace]
members = ["."]

[[bin]]
name = "lp_reader"
path = "fuzz_targets/lp_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mps_reader"
path = "fuzz_targets/mps_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_model"
path = "fuzz_targets/decode_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_environment"
path = "fuzz_targets/decode_environment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_solution"
path = "fuzz_targets/decode_solution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_expression"
path = "fuzz_targets/decode_expression.rs"
test = false
doc = false
bench = false
