[project]
name = "rs-lunamodel-tests"
version = "0"
description = "Test harness for rs-lunamodel (not published)."
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "rs-lunamodel-integration-ext",
]

[dependency-groups]
local = ["luna-model"]
pypi = ["luna-model>=0.8.0a1"]
dev = ["protobuf", "grpcio-tools"]

[tool.uv]
package = false
default-groups = ["local"]
conflicts = [[{ group = "local" }, { group = "pypi" }]]

[tool.uv.sources]
rs-lunamodel-integration-ext = { path = "integration_ext", editable = true }
luna-model = [
    { path = "../../py-lunamodel", group = "local" },
]
