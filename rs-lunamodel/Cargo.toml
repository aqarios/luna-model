[package]
name = "rs-lunamodel"
version = "0.0.1"
edition = "2024"
authors = [
  "Jonas Blenninger <jonas.blenninger@aqarios.com>",
  "David Bucher <david.bucher@aqarios.com>",
  "Maximilian Janetschek <maximilian.janetschek@aqarios.com>",
]
description = "LunaModel native extension bindings via C"
homepage = "https://docs.aqarios.com/luna-model/intro"
repository = "https://github.com/aqarios/luna-model"
license = "Apache-2.0"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
debug = false
incremental = false

# Keep out of workspace
[workspace]
members = ["derive"]

[dependencies]
itertools = "0.15.0"
# Table type + ABI structs only — no luna-model core, so consumers never link a
# second copy of the library. The `LunaModelCApi` function pointers come from the
# host's `_C_API` capsule at runtime.
lunamodel-cext-vtable = { path = "../crates/cext-vtable" }
lunamodel-types = { path = "../crates/types" }
num = "0.4.3"
rs-lunamodel-derive = { path = "./derive" }
