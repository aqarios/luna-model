language = "C"
header = "/* Generated by cbindgen from lunamodel-capi. Do not edit by hand. */"
include_guard = "LUNA_MODEL_DECLS_H"
cpp_compat = true
style = "type"
tab_width = 4

[parse]
# Only parse this crate; treat luna-model core types (Model, Solution) as opaque.
parse_deps = false

[export]
# These aren't reachable from an exported function, so force their inclusion.
include = ["LunaModelCApi", "CAPI_ABI_VERSION"]

[export.rename]
# Give the ABI-version constant a namespaced C name.
"CAPI_ABI_VERSION" = "LUNA_MODEL_CAPI_ABI_VERSION"

[enum]
# LmStatus variants become LmStatus_Ok, LmStatus_NullPointer, ...
prefix_with_name = true
