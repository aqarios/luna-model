language = "C"
header = "/* Generated by cbindgen from lunamodel-capi-host. Do not edit by hand. */"
include_guard = "LUNA_MODEL_TYPES_H"
cpp_compat = true
style = "type"
tab_width = 4

[parse]
parse_deps = true
include = ["lunamodel-capi"]

[export]
item_types = ["constants", "enums", "structs", "unions", "typedefs", "opaque"]
# `LmPluginTransform`/`LmPluginAnalysis` are not reachable from the vtable (plugins hand them to the
# host, not vice versa), so force-emit them for C/C++ plugin authors. Their field types are already
# reachable via `LunaModelCApi`.
include = ["LunaModelCApi", "CAPI_ABI_VERSION", "LmPluginTransform", "LmPluginAnalysis"]

[export.rename]
"CAPI_ABI_VERSION" = "LUNA_MODEL_CAPI_ABI_VERSION"

[enum]
prefix_with_name = true
