lunamodel-capi = { workspace = true }
lunamodel-capi-handle = { workspace = true }
lunamodel-capi-plugin = { workspace = true }

itertools = { workspace = true }
indexmap = { workspace = true }

[build-dependencies]
cbindgen = "0.29.4"
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
lunamodel-transpiler = { workspace = true }
lunamodel-transform = { workspace = true }
rs-lunamodel = { path = "../../rs-lunamodel" }
