# Reusable: everything built on the C API — the rs-lunamodel SDK, the C and C++
# test suites, the Rust/C++ extensions driven from Python against the local
# luna-model wheel, and the drift checks for the committed header/.proto copies.
# Each suite runs through its `just` recipe, so CI and `just test` stay in sync.
name: Test C API

on:
  workflow_call:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: rs-lunamodel
            run: |
              cargo fmt --manifest-path rs-lunamodel/Cargo.toml --all -- --check
              cargo clippy --manifest-path rs-lunamodel/Cargo.toml --all-targets -- -D warnings
              cargo test --manifest-path rs-lunamodel/Cargo.toml
          - suite: c
            run: just ctest
          - suite: cpp
            run: just cpp-test
          - suite: rs-ext
            run: just rs-ext-test
          - suite: rs-plugin
            run: just rs-plugin-test
          - suite: cpp-plugin
            run: just cpp-plugin-test
          - suite: drift
            run: just cdrift wheelheadersdrift protodrift
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read Rust toolchain channel
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.suite }}
          workspaces: |
            . -> target
            rs-lunamodel -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          activate-environment: false
          enable-cache: true
          cache-suffix: capi

      - name: Install protobuf (C++ plugin extension)
        if: matrix.suite == 'cpp-plugin'
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler

      - name: Install just
        run: |
          uv tool install rust-just
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Run ${{ matrix.suite }}
        run: ${{ matrix.run }}
