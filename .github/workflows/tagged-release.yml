# Stage 3 of the release train: a `vX.Y.Z` tag push builds every artifact and
# publishes to PyPI, npm, and GitHub Releases.
#
# Registry authentication uses OIDC Trusted Publishing exclusively — there are
# no registry tokens in this repository's secrets:
#   - PyPI:  configure a trusted publisher for project `luna_model` with
#            workflow file `tagged-release.yml` and environment `pypi`
#   - npm:   configure trusted publishing for `@aqarios/luna-model` (and the
#            generated platform packages) with workflow file
#            `tagged-release.yml` and environment `npm`
# Both `pypi` and `npm` must exist as environments in the repository settings;
# add required reviewers there for an extra human gate if desired.
name: Tagged Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Release version: $version"

      - name: Verify all versions match the tag
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: sh ci/tools/check-versions.sh

  build-wheels:
    name: Build wheels
    needs: verify-version
    uses: ./.github/workflows/_build-wheels.yml

  build-js:
    name: Build JS
    needs: verify-version
    uses: ./.github/workflows/_build-js.yml

  build-js-wasm:
    name: Build JS WASM
    needs: verify-version
    uses: ./.github/workflows/_build-js-wasm.yml

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-version, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/luna_model/${{ needs.verify-version.outputs.version }}/
    permissions:
      # OIDC token for PyPI Trusted Publishing
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Publish (trusted publishing + attestations)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          # Skip wheels already on PyPI so re-running a partially-failed
          # release finishes instead of aborting on the first upload.
          skip-existing: true

  publish-npm:
    name: Publish to npm
    needs: [verify-version, build-js, build-js-wasm]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@aqarios/luna-model/v/${{ needs.verify-version.outputs.version }}
    permissions:
      # OIDC token for npm Trusted Publishing (provenance included)
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: js-lunamodel
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11.18.0 && npm --version

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: js-lunamodel/artifacts-native
          pattern: js-native-*
          merge-multiple: true

      - name: Download WASM artifact
        uses: actions/download-artifact@v8.0.1
        with:
          path: js-lunamodel/artifacts-wasm
          name: js-wasm32-wasi

      - name: Create per-target npm package directories
        run: |
          bunx napi create-npm-dirs --config-path napi.json --npm-dir ./npm
          bunx napi create-npm-dirs --config-path napi.wasm.json --npm-dir ./npm

      - name: Assemble per-target npm packages
        # Each run also drops a copy of its artifacts in the package root and
        # prunes the ones its own config doesn't list. That churn is harmless:
        # the main package ships no binaries (see the optionalDependencies step
        # below), and `files` excludes them. The one root file that does get
        # published is index.js, which both runs leave at whatever the wasm
        # build generated — the only copy stamped with the release version.
        run: |
          bunx napi artifacts --config-path napi.json \
            --output-dir ./artifacts-native --npm-dir ./npm
          bunx napi artifacts --config-path napi.wasm.json \
            --output-dir ./artifacts-wasm --build-output-dir ./artifacts-wasm --npm-dir ./npm

      - name: Finalize WASM package (types + platform-neutral metadata)
        run: |
          # shellcheck disable=SC2016 # ${...} below are JS template literals
          for d in npm/*wasm*/; do
            cp index.d.ts "$d/index.d.ts"
            cp THIRD_PARTY_LICENSES.txt "$d/THIRD_PARTY_LICENSES.txt"
            PKG_PATH="$d/package.json" node -e '
              const fs = require("node:fs");
              const path = process.env.PKG_PATH;
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

              // A browser/WASI package must stay platform-neutral: cpu/os/libc
              // are npm host-install filters, not runtime capability tags.
              delete pkg.cpu;
              delete pkg.os;
              delete pkg.libc;

              pkg.types = "index.d.ts";
              pkg.files = Array.from(new Set([...(pkg.files || []), "index.d.ts"]));

              // Optional repo-level overrides for the wasm package.
              const overlayPath = "wasm-package.json";
              if (fs.existsSync(overlayPath)) {
                const overlay = JSON.parse(fs.readFileSync(overlayPath, "utf8"));
                const files = pkg.files;
                Object.assign(pkg, overlay);
                pkg.files = Array.from(new Set([...files, ...(overlay.files || [])]));
              }

              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            '
          done

      - name: Verify WASM package metadata
        run: |
          # shellcheck disable=SC2016 # ${...} below are JS template literals
          for d in npm/*wasm*/; do
            PKG_PATH="$d/package.json" node -e '
              const fs = require("node:fs");
              const path = process.env.PKG_PATH;
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

              for (const field of ["cpu", "os", "libc"]) {
                if (field in pkg) throw new Error(`${path} still has host platform filter: ${field}`);
              }
              if (!pkg.main) throw new Error(`${path} is missing main`);
              if (!pkg.browser) throw new Error(`${path} is missing browser entry`);
              if (pkg.types !== "index.d.ts") throw new Error(`${path} has unexpected types entry`);
              if (!pkg.exports?.["."]?.browser) throw new Error(`${path} is missing the browser export`);
              if (!pkg.exports?.["."]?.import) throw new Error(`${path} is missing the import export`);
              if (!pkg.exports?.["."]?.require) throw new Error(`${path} is missing the CommonJS export`);
            '
          done

      - name: Declare native packages as optionalDependencies
        # The main package carries no binaries; it resolves them at install time
        # through optionalDependencies, which is what the generated index.js
        # loader expects (`require("@aqarios/luna-model-<target>")`). npm skips
        # the entries whose cpu/os/libc don't match the host, so an install
        # pulls exactly one of them.
        #
        # The wasm package is published but deliberately NOT declared here. It
        # is platform-neutral by design, so npm would install it everywhere —
        # 3.7MB per install once @emnapi/@tybys/@napi-rs/tslib are pulled in,
        # for a fallback that a Node consumer on any of the eight native targets
        # never reaches. Consumers who want it (browsers, bundlers, platforms
        # outside the eight) depend on @aqarios/luna-model-wasm32-wasi directly;
        # the loader picks it up from node_modules either way. This is what
        # rolldown and oxc-parser do with their own wasm32-wasi bindings.
        #
        # Generated here rather than committed so the version never has to be
        # kept in lockstep: ci/tools/check-versions.sh guards exactly two
        # version statements, and this would otherwise be a third.
        run: |
          # shellcheck disable=SC2016 # ${...} below are JS template literals
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const optionalDependencies = {};
            const optedOut = [];

            for (const dir of fs.readdirSync("npm").sort()) {
              const target = JSON.parse(fs.readFileSync(`npm/${dir}/package.json`, "utf8"));
              if (target.version !== pkg.version) {
                throw new Error(`npm/${dir} is ${target.version}, main package is ${pkg.version}`);
              }
              if (dir.includes("wasm")) {
                optedOut.push(target.name);
                continue;
              }
              optionalDependencies[target.name] = target.version;
            }

            const names = Object.keys(optionalDependencies);
            if (names.length === 0) throw new Error("no native packages found under npm/");

            pkg.optionalDependencies = optionalDependencies;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`optionalDependencies @ ${pkg.version}:\n  ${names.join("\n  ")}`);
            console.log(`published but opt-in:\n  ${optedOut.join("\n  ") || "(none)"}`);
          '

      - name: Verify main package resolves its native bindings
        # A main package that bundles nothing and declares nothing installs
        # cleanly and then throws `Cannot find native binding` on first require
        # — see v0.6.16-beta.3. Assert both halves before anything is published.
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          # shellcheck disable=SC2016 # ${...} below are JS template literals
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const optional = pkg.optionalDependencies || {};
            const native = JSON.parse(fs.readFileSync("napi.json", "utf8")).targets.length;
            const wasm = JSON.parse(fs.readFileSync("napi.wasm.json", "utf8")).targets.length;

            const dirs = fs.readdirSync("npm");
            if (dirs.length !== native + wasm) {
              throw new Error(`built ${dirs.length} per-target packages, expected ${native + wasm}`);
            }
            for (const dir of dirs) {
              const { name } = JSON.parse(fs.readFileSync(`npm/${dir}/package.json`, "utf8"));
              const declared = optional[name];
              if (dir.includes("wasm")) {
                if (declared) {
                  throw new Error(`${name} is opt-in and must not be an optionalDependency`);
                }
              } else if (declared !== pkg.version) {
                throw new Error(`${name} is not an optionalDependency at ${pkg.version}`);
              }
            }
            if (Object.keys(optional).length !== native) {
              throw new Error(`declared ${Object.keys(optional).length} optionalDependencies, expected ${native}`);
            }

            const strays = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"))[0]
              .files.map((f) => f.path)
              .filter((p) => p.endsWith(".node") || p.endsWith(".wasm"));
            if (strays.length > 0) {
              throw new Error(`main package should bundle no binaries, got: ${strays.join(", ")}`);
            }

            console.log(`main package declares all ${native} native packages and bundles none`);
          '

      - name: Publish packages
        # Per-target packages first, the main package last, so the main
        # package never points at optionalDependencies that don't exist yet.
        # No token: npm exchanges the workflow's OIDC token with the registry
        # (trusted publishing) and generates provenance automatically.
        #
        # Publishing is idempotent: a version already on the registry is
        # skipped instead of aborting the step, so re-running a release that
        # failed partway through finishes the packages that didn't make it.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          set -e
          tag=latest
          [ "$PRERELEASE" = "true" ] && tag=next

          publish_pkg() {
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "✓ $name@$version already published — skipping"
              return 0
            fi
            echo "→ publishing $name@$version ($tag)"
            npm publish --provenance --access public --tag "$tag"
          }

          for d in npm/*/; do
            (cd "$d" && publish_pkg)
          done
          echo "→ main package"
          publish_pkg

  github-release:
    name: Create GitHub Release
    needs: [verify-version, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-version.outputs.version }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          flags="--verify-tag --generate-notes"
          if [ "$PRERELEASE" = "true" ]; then
            flags="$flags --prerelease"
          fi
          # shellcheck disable=SC2086
          find assets -type f \( -name '*.whl' -o -name '*.node' -o -name '*.wasm' \) -print0 \
            | xargs -0 gh release create "v${VERSION}" --title "v${VERSION}" $flags
