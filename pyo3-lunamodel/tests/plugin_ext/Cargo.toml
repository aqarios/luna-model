[package]
name = "luna-plugin-ext"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[lib]
name = "luna_plugin_ext"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "multiple-pymethods"] }
pyo3-lunamodel = { path = "../.." }
rs-lunamodel = { path = "../../../rs-lunamodel" }
prost = "0.14"
