[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "luna-plugin-ext"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "luna-model",
]

[tool.maturin]
module-name = "luna_plugin_ext"
manifest-path = "Cargo.toml"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
