[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4.0", "luna-model"]
build-backend = "scikit_build_core.build"

[project]
name = "luna-cxx-plugin-ext"
version = "0.0.1"
description = "A C++ luna-model plugin (nanobind), exercising the cxx-lunamodel plugin SDK from Python."
requires-python = ">=3.11"
dependencies = ["luna-model"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"

# luna-model is the local (Rust/maturin) wheel in this repo, not a published package.
[tool.uv.sources]
luna-model = { path = "../../../py-lunamodel" }

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.8.0"]
